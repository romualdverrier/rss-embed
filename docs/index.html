<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSS Embed</title>

  <!-- Roboto (fallback system) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Swiper -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <style>
    :root{
      --line:#dde5ec;
      --muted:#6b7c89;
      --text:#1f2933;
      --bg:#ffffff;
      --soft:#f3f6f9;
      --font: Roboto, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    }

    html, body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--font);
    }

    .wrap{ padding:14px 16px 18px; }

    /* Header optionnel */
    .title{ font-size:18px; font-weight:700; margin:0 0 6px; }
    .hint{ font-size:12px; color:var(--muted); margin:0 0 12px; }

    /* -------------------------
       Meta : source + date
    ------------------------- */
    .meta-line{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin: 6px 0 8px;
    }
    .source{ font-size:12px; font-weight:600; color:#334155; }
    .meta{ font-size:12px; color:var(--muted); }

    /* -------------------------
       LIST (simple, propre)
       -> un SEUL cadre / pas de sous-cadres
    ------------------------- */
    .list{ display:flex; flex-direction:column; gap:0; }

    .item{
      display:flex;
      gap:14px;
      padding:14px 0;
      text-decoration:none;
      color:inherit;
      border-bottom:1px solid var(--line);
    }
    .item:hover{ background: rgba(0,0,0,0.01); }

    .item.no-media{ gap:0; }

    .media{
      width:140px;
      flex: 0 0 140px;
    }
    .media img{
      width:140px;
      height:92px;
      object-fit:cover;
      border-radius:12px;
      display:block;
      background:var(--soft);
    }

    .body{ flex:1; min-width:0; }
    .title{
      font-size:16px;
      font-weight:700;
      line-height:1.25;
      margin:0;
    }
    .excerpt{
      font-size:13px;
      line-height:1.4;
      color:#2f3b45;
      margin:0;
    }

    /* -------------------------
       CAROUSEL (Swiper)
    ------------------------- */
    .swiper{ padding-bottom:34px; }
    .swiper-slide{ height:auto; }

    .card{
      display:block;
      text-decoration:none;
      color:inherit;
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      background:#fff;
    }
    .card:hover{ border-color:#b9c7d3; }

    .card-media{
      height:150px;
      background-size:cover;
      background-position:center;
      background-color:var(--soft);
      border-bottom:1px solid var(--line);
    }
    .card-media.placeholder{
      background: linear-gradient(135deg, rgba(221,229,236,.95), rgba(243,246,249,.95));
    }

    /* si tout le flux n’a AUCUNE image => cards compactes, pas de zone media */
    .card.compact .card-body{ padding-top:14px; }

    .card-body{ padding:12px 12px 14px; }

    .card-title{
      font-size:15px;
      font-weight:700;
      line-height:1.25;
      margin:0;
    }
    .card-excerpt{
      font-size:13px;
      line-height:1.4;
      color:#2f3b45;
      margin:0;
    }

    /* Flèches : grosses zones cliquables (accessibilité) */
    .swiper-button-prev,
    .swiper-button-next{
      width:44px;
      height:44px;
      border-radius:999px;
      background: rgba(255,255,255,.96);
      border: 1px solid var(--line);
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
    }
    .swiper-button-prev::after,
    .swiper-button-next::after{
      font-size:18px;
      font-weight:800;
    }
    .swiper-button-prev{ left: 10px; }
    .swiper-button-next{ right: 10px; }

    /* Erreurs */
    .error{
      margin-top:12px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:10px;
      color:var(--muted);
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1 class="title" id="feedTitle">Flux RSS</h1>
    <p class="hint" id="hint"></p>

    <div class="swiper" id="swiperBox" style="display:none;">
      <div class="swiper-wrapper" id="slides"></div>
      <div class="swiper-button-prev" aria-label="Précédent"></div>
      <div class="swiper-button-next" aria-label="Suivant"></div>
      <div class="swiper-pagination"></div>
    </div>

    <div class="list" id="listBox" style="display:none;"></div>

    <div id="err" class="error" style="display:none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
