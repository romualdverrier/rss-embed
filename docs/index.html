<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSS Viewer</title>

  <!-- Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Swiper -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <style>
    :root { --line:#dde5ec; --muted:#6b7c89; --text:#1f2933; }
    body{ margin:0; font-family:Roboto,system-ui,Arial,sans-serif; background:#fff; color:var(--text); }
    .wrap{ padding:14px 16px 18px; }
    .title{ font-size:18px; font-weight:700; margin:0 0 12px; }
    .hint{ font-size:12px; color:var(--muted); margin:0 0 12px; }

    .card{
      display:block; text-decoration:none; color:inherit;
      border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff;
    }
    .card:hover{ border-color:#b9c7d3; }
    .thumb{ height:140px; background-size:cover; background-position:center; border-bottom:1px solid var(--line); }
    .content{ padding:12px 12px 14px; }
    .card-title{ font-size:15px; font-weight:700; line-height:1.25; margin:0 0 6px; }
    .meta{ font-size:12px; color:var(--muted); margin:0 0 8px; }
    .excerpt{ font-size:13px; line-height:1.35; margin:0; }

    .swiper{ padding-bottom:28px; }
    .swiper-slide{ height:auto; }
    .error{ padding:12px; border:1px solid var(--line); border-radius:10px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title" id="feedTitle">Flux RSS</h1>
    <p class="hint" id="hint"></p>

    <div class="swiper" id="swiperBox" style="display:none;">
      <div class="swiper-wrapper" id="slides"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
      <div class="swiper-pagination"></div>
    </div>

    <div id="err" class="error" style="display:none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    const feed = qs.get("feed");
    const limit = Math.max(1, Math.min(50, parseInt(qs.get("limit") || "20", 10)));

    const hintEl = document.getElementById("hint");
    hintEl.textContent = feed ? `source: ${feed} | limit: ${limit}` : "Ajoute ?feed=<url> dans l'URL.";

    if (!feed) {
      const e = document.getElementById("err");
      e.style.display = "block";
      e.textContent = "Paramètre manquant : ?feed=https://...";
      throw new Error("missing feed");
    }

    // Multi-proxy (évite CORS + contourne certains refus)
    const PROXIES = [
      // 1) AllOrigins
      (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),

      // 2) CorsProxy.io
      (u) => "https://corsproxy.io/?" + encodeURIComponent(u),

      // 3) Jina Reader (récupère le contenu via leur infra)
      (u) => {
        const clean = u.replace(/^https?:\/\//, "");
        return "https://r.jina.ai/https://" + clean;
      },
    ];

    async function fetchXmlWithFallback(url) {
      let lastErr = null;
      for (const mk of PROXIES) {
        const target = mk(url);
        try {
          const r = await fetch(target, { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const txt = await r.text();
          // sanity check
          if (!txt || (!txt.includes("<rss") && !txt.includes("<feed") && !txt.includes("<channel"))) {
            throw new Error("Réponse non RSS/Atom");
          }
          return txt;
        } catch (e) {
          lastErr = new Error(`${e.message} via ${target}`);
        }
      }
      throw lastErr || new Error("Impossible de récupérer le flux via les proxys.");
    }

    function text(el, sel) {
      const n = el.querySelector(sel);
      return n ? (n.textContent || "").trim() : "";
    }

    function firstImgFromHtml(html) {
      const m = /<img[^>]+src="([^"]+)"/i.exec(html || "");
      return m ? m[1] : "";
    }

    function pickImageFromRssItem(item) {
      // RSS: enclosure
      const enc = item.querySelector("enclosure[url]");
      if (enc && enc.getAttribute("url")) return enc.getAttribute("url");

      // RSS: media:content / media:thumbnail
      const mc = item.querySelector("media\\:content[url], content[url]");
      if (mc && mc.getAttribute("url")) return mc.getAttribute("url");

      const mt = item.querySelector("media\\:thumbnail[url], thumbnail[url]");
      if (mt && mt.getAttribute("url")) return mt.getAttribute("url");

      // RSS: description img
      const desc = text(item, "description");
      return firstImgFromHtml(desc);
    }

    function pickImageFromAtomEntry(entry) {
      // Atom: media:thumbnail / media:content
      const mt = entry.querySelector("media\\:thumbnail[url], thumbnail[url]");
      if (mt && mt.getAttribute("url")) return mt.getAttribute("url");

      const mc = entry.querySelector("media\\:content[url], content[url]");
      if (mc && mc.getAttribute("url")) return mc.getAttribute("url");

      // Atom: link rel="enclosure" type="image/*"
      const links = Array.from(entry.querySelectorAll("link"));
      for (const l of links) {
        const rel = (l.getAttribute("rel") || "").toLowerCase();
        const type = (l.getAttribute("type") || "").toLowerCase();
        const href = l.getAttribute("href");
        if (href && (rel === "enclosure" || type.startsWith("image/"))) return href;
      }

      // Atom: content/summary HTML
      const content = entry.querySelector("content");
      if (content) return firstImgFromHtml(content.textContent || "");
      const summary = entry.querySelector("summary");
      if (summary) return firstImgFromHtml(summary.textContent || "");

      return "";
    }

    function stripHtml(html) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html || "";
      return (tmp.textContent || "").replace(/\s+/g, " ").trim();
    }

    function setTitleFromDoc(doc) {
      // RSS
      const rssTitle = doc.querySelector("channel > title");
      if (rssTitle && rssTitle.textContent) {
        document.getElementById("feedTitle").textContent = rssTitle.textContent.trim();
        return;
      }
      // Atom
      const atomTitle = doc.querySelector("feed > title");
      if (atomTitle && atomTitle.textContent) {
        document.getElementById("feedTitle").textContent = atomTitle.textContent.trim();
      }
    }

    function buildSlide({ title, link, pub, excerpt, img }) {
      const slide = document.createElement("div");
      slide.className = "swiper-slide";
      slide.innerHTML = `
        <a class="card" href="${link}" target="_blank" rel="noopener noreferrer">
          ${img ? `<div class="thumb" style="background-image:url('${img}')"></div>` : ``}
          <div class="content">
            <div class="card-title">${title}</div>
            ${pub ? `<div class="meta">${pub}</div>` : ``}
            ${excerpt ? `<p class="excerpt">${excerpt}${excerpt.length>=220 ? "…" : ""}</p>` : ``}
          </div>
        </a>`;
      return slide;
    }

    fetchXmlWithFallback(feed)
      .then(xmlText => new DOMParser().parseFromString(xmlText, "text/xml"))
      .then(doc => {
        setTitleFromDoc(doc);

        const slides = document.getElementById("slides");

        // RSS items
        const rssItems = Array.from(doc.querySelectorAll("item"));
        // Atom entries
        const atomEntries = Array.from(doc.querySelectorAll("entry"));

        let count = 0;

        if (rssItems.length) {
          rssItems.slice(0, limit).forEach(it => {
            const title = text(it, "title") || "Sans titre";
            const link = text(it, "link") || "#";
            const pub = text(it, "pubDate") || text(it, "dc\\:date");
            const descHtml = text(it, "description");
            const excerpt = stripHtml(descHtml).slice(0, 220);
            const img = pickImageFromRssItem(it);

            slides.appendChild(buildSlide({ title, link, pub, excerpt, img }));
            count += 1;
          });
        } else if (atomEntries.length) {
          atomEntries.slice(0, limit).forEach(en => {
            const title = text(en, "title") || "Sans titre";
            // Atom link: href
            const linkEl = en.querySelector("link[href]") || en.querySelector("link");
            const link = linkEl ? (linkEl.getAttribute("href") || linkEl.textContent || "#") : "#";
            const pub = text(en, "updated") || text(en, "published");
            const content = en.querySelector("content");
            const summary = en.querySelector("summary");
            const raw = (content && content.textContent) ? content.textContent : (summary ? summary.textContent : "");
            const excerpt = stripHtml(raw).slice(0, 220);
            const img = pickImageFromAtomEntry(en);

            slides.appendChild(buildSlide({ title, link, pub, excerpt, img }));
            count += 1;
          });
        } else {
          throw new Error("Aucun item RSS (<item>) ni entry Atom (<entry>) détecté dans le flux.");
        }

        if (!count) throw new Error("Aucun élément à afficher.");

        document.getElementById("swiperBox").style.display = "block";

        new Swiper(".swiper", {
          slidesPerView: 1,
          spaceBetween: 16,
          loop: false,
          pagination: { el: ".swiper-pagination", clickable: true },
          navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
          breakpoints: {
            720: { slidesPerView: 2 },
            1060: { slidesPerView: 3 }
          }
        });
      })
      .catch(err => {
        const e = document.getElementById("err");
        e.style.display = "block";
        e.textContent = "Erreur : " + (err && err.message ? err.message : err);
      });
  </script>
</body>
</html>
