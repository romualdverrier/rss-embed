<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSS Viewer</title>

  <!-- Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Swiper (carrousel) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <style>
    :root { --line:#dde5ec; --muted:#6b7c89; --text:#1f2933; }

    body{ margin:0; font-family:Roboto,system-ui,Arial,sans-serif; background:#fff; color:var(--text); }
    .wrap{ padding:14px 16px 18px; }

    /* Header optionnel */
    .title{ font-size:18px; font-weight:700; margin:0 0 8px; }
    .hint{ font-size:12px; color:var(--muted); margin:0 0 12px; }

    /* Badge source */
    .badge{
      display:inline-flex;
      align-items:center;
      font-size:12px;
      font-weight:500;
      color: var(--muted);
      border:1px solid var(--line);
      border-radius: 999px;
      padding: 2px 10px;
      white-space: nowrap;
      line-height: 1.6;
    }

    /* Ligne meta (source + date) */
    .meta-line{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      margin: 0 0 8px;
    }
    .meta{ font-size:12px; color:var(--muted); }

    /* IMPORTANT : empêche tout style de liste/puce injecté par des proxys/feeds */
    #listBox, #slides { list-style: none; padding-left: 0; margin: 0; }
    .badge::marker { content: ""; } /* au cas où */

    /* --- LISTE (vertical) --- */
    .list{ display:flex; flex-direction:column; gap:12px; }

    .row{
      display:flex;
      gap:12px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      text-decoration:none;
      color:inherit;
      background:#fff;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .row:hover{ border-color:#b9c7d3; }

    .thumb{
      width: 210px;
      min-width: 210px;
      height: 118px;
      border-radius:12px;
      border:1px solid var(--line);
      background-size: cover;
      background-position: center;
      background-color: #f3f6f9;
      position: relative;
      overflow: hidden;
    }

    /* Placeholder si pas d’image */
    .thumb.placeholder::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(135deg, rgba(221,229,236,.95), rgba(243,246,249,.95));
    }
    .thumb.placeholder::before{
      content:"";
      position:absolute;
      width:42px;
      height:42px;
      border:1px solid rgba(107,124,137,.35);
      border-radius:10px;
      left:14px;
      top:14px;
      background: rgba(255,255,255,0.35);
    }

    .txt{ flex:1; min-width: 0; }
    .row-title{
      font-size:16px;
      font-weight:700;
      line-height:1.25;
      margin:0 0 6px;
    }
    .excerpt{ font-size:13px; line-height:1.35; margin:0; color:#2f3b45; }

    /* --- CAROUSEL --- */
    .swiper{ padding-bottom:30px; }
    .swiper-slide{ height:auto; }
    .card{
      display:block; text-decoration:none; color:inherit;
      border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .card:hover{ border-color:#b9c7d3; }
    .card-thumb{ height:140px; background-size:cover; background-position:center; border-bottom:1px solid var(--line); background-color:#f3f6f9; }
    .content{ padding:12px 12px 14px; }
    .card-title{ font-size:15px; font-weight:700; line-height:1.25; margin:0 0 6px; }

    .error{ padding:12px; border:1px solid var(--line); border-radius:10px; color:var(--muted); white-space:pre-wrap; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1 class="title" id="feedTitle">Flux RSS</h1>
    <p class="hint" id="hint"></p>

    <!-- Carousel -->
    <div class="swiper" id="swiperBox" style="display:none;">
      <div class="swiper-wrapper" id="slides"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
      <div class="swiper-pagination"></div>
    </div>

    <!-- List -->
    <div class="list" id="listBox" style="display:none;"></div>

    <div id="err" class="error" style="display:none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // =========================
    // 1) Sécurité : whitelist de flux autorisés
    // =========================
    const ALLOWED_FEEDS = [
      "https://edunumrech.hypotheses.org/feed",
      "https://muse.pleiade.education.fr/rss/dcaf719f-f512-4e26-94b0-7f2bc15d0e74/"
    ];
    // Pour en ajouter : ajoute une URL exacte ici.

    // =========================
    // Params URL
    // =========================
    const qs = new URLSearchParams(location.search);
    const feed = qs.get("feed");
    const limit = Math.max(1, Math.min(50, parseInt(qs.get("limit") || "20", 10)));
    const layout = (qs.get("layout") || "list").toLowerCase(); // list | carousel
    const forcedSource = qs.get("source"); // optionnel
    const header = qs.get("header") !== "0"; // visible par défaut
    const images = qs.get("images") !== "0"; // images par défaut

    const hintEl = document.getElementById("hint");
    const feedTitleEl = document.getElementById("feedTitle");

    function showError(msg){
      const e = document.getElementById("err");
      e.style.display = "block";
      e.textContent = msg;
    }

    if (!feed) {
      showError("Paramètre manquant : ?feed=https://...");
      throw new Error("missing feed");
    }

    // Sécurité : on n'accepte que les flux whitelistes
    if (!ALLOWED_FEEDS.includes(feed)) {
      showError(
        "Flux non autorisé.\n\n" +
        "Flux autorisés :\n- " + ALLOWED_FEEDS.join("\n- ")
      );
      throw new Error("feed not allowed");
    }

    if (!header) {
      feedTitleEl.style.display = "none";
      hintEl.style.display = "none";
    } else {
      hintEl.textContent = `limit: ${limit} | layout: ${layout}`;
    }

    // =========================
    // Proxys RAW
    // =========================
    const PROXIES = [
      (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
      (u) => "https://corsproxy.io/?" + encodeURIComponent(u),
      (u) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
      (u) => "https://thingproxy.freeboard.io/fetch/" + u,
      (u) => "https://cors-proxy.htmldriven.com/?url=" + encodeURIComponent(u),
    ];

    async function fetchXmlWithFallback(url) {
      let lastErr = null;
      for (const mk of PROXIES) {
        const target = mk(url);
        try {
          const r = await fetch(target, { cache: "no-store" });
          if (!r.ok) throw new Error("HTTP " + r.status);

          const txt = await r.text();
          const head = (txt || "").trimStart().slice(0, 220);

          const looksLikeXml =
            head.startsWith("<?xml") || head.startsWith("<rss") || head.startsWith("<feed") ||
            head.includes("<rss") || head.includes("<feed") || head.includes("<channel");
          const looksLikeHtml = head.startsWith("<!doctype") || head.startsWith("<html") || head.includes("<body");

          if (!txt || !looksLikeXml || looksLikeHtml) throw new Error("Réponse non RSS/Atom");
          return txt;
        } catch (e) {
          lastErr = new Error(`${e.message} via ${target}`);
        }
      }
      throw lastErr || new Error("Impossible de récupérer le flux via les proxys.");
    }

    // =========================
    // Helpers parsing
    // =========================
    function text(el, sel) {
      const n = el.querySelector(sel);
      return n ? (n.textContent || "").trim() : "";
    }

    function firstImgFromHtml(html) {
      const m = /<img[^>]+src="([^"]+)"/i.exec(html || "");
      return m ? m[1] : "";
    }

    function stripHtml(html) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html || "";
      return (tmp.textContent || "").replace(/\s+/g, " ").trim();
    }

    function getItems(doc) {
      const rssItems = Array.from(doc.querySelectorAll("item"));
      if (rssItems.length) return { type: "rss", items: rssItems };
      const atomEntries = Array.from(doc.querySelectorAll("entry"));
      if (atomEntries.length) return { type: "atom", items: atomEntries };
      return { type: "unknown", items: [] };
    }

    function getTitle(doc) {
      const rssTitle = doc.querySelector("channel > title");
      if (rssTitle && rssTitle.textContent) return rssTitle.textContent.trim();
      const atomTitle = doc.querySelector("feed > title");
      if (atomTitle && atomTitle.textContent) return atomTitle.textContent.trim();
      return "";
    }

    function getLink(node, type) {
      if (type === "rss") return text(node, "link") || "#";
      const alt = node.querySelector('link[rel="alternate"][href]') || node.querySelector('link[href]');
      return alt ? (alt.getAttribute("href") || "#") : "#";
    }

    function getPublishedRaw(node, type) {
      if (type === "rss") return text(node, "pubDate") || text(node, "dc\\:date");
      return text(node, "updated") || text(node, "published");
    }

    function parseDate(raw) {
      if (!raw) return null;
      const d = new Date(raw);
      if (Number.isNaN(d.getTime())) return null;
      return d;
    }

    // Date FR : "9 janvier 2026"
    function formatDateFr(raw) {
      const d = parseDate(raw);
      if (!d) return "";
      return new Intl.DateTimeFormat("fr-FR", { day:"numeric", month:"long", year:"numeric" }).format(d);
    }

    function getSummary(node, type) {
      if (type === "rss") return text(node, "description") || text(node, "content\\:encoded");
      return text(node, "summary") || text(node, "content");
    }

    function getSourceLabel(node) {
      return (forcedSource || text(node, "source") || text(node, "dc\\:creator") || "").trim();
    }

    function pickImage(node, type) {
      if (!images) return "";

      const enc = node.querySelector("enclosure[url]");
      if (enc && enc.getAttribute("url")) return enc.getAttribute("url");

      const mc = node.querySelector("media\\:content[url], content[url]");
      if (mc && mc.getAttribute("url")) return mc.getAttribute("url");

      const mt = node.querySelector("media\\:thumbnail[url], thumbnail[url]");
      if (mt && mt.getAttribute("url")) return mt.getAttribute("url");

      const aenc = node.querySelector('link[rel="enclosure"][href]');
      if (aenc && aenc.getAttribute("href")) return aenc.getAttribute("href");

      const contentEncoded = text(node, "content\\:encoded");
      const imgFromContent = firstImgFromHtml(contentEncoded);
      if (imgFromContent) return imgFromContent;

      const raw = getSummary(node, type);
      return firstImgFromHtml(raw);
    }

    // =========================
    // Render
    // =========================
    function buildMetaLine(src, dateFr) {
      if (!src && !dateFr) return "";
      return `
        <div class="meta-line">
          ${src ? `<span class="badge">${src}</span>` : ``}
          ${dateFr ? `<span class="meta">${dateFr}</span>` : ``}
        </div>
      `;
    }

    function renderList(rows) {
      const box = document.getElementById("listBox");
      rows.forEach(r => box.appendChild(r));
      box.style.display = "flex";
    }

    function renderCarousel(cardHtmls) {
      const slides = document.getElementById("slides");
      cardHtmls.forEach(html => {
        const slide = document.createElement("div");
        slide.className = "swiper-slide";
        slide.innerHTML = html;
        slides.appendChild(slide);
      });

      document.getElementById("swiperBox").style.display = "block";

      new Swiper(".swiper", {
        slidesPerView: 1,
        spaceBetween: 16,
        loop: false,
        pagination: { el: ".swiper-pagination", clickable: true },
        navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
        breakpoints: { 720: { slidesPerView: 2 }, 1060: { slidesPerView: 3 } }
      });
    }

    // =========================
    // Main
    // =========================
    fetchXmlWithFallback(feed)
      .then(xmlText => new DOMParser().parseFromString(xmlText, "text/xml"))
      .then(doc => {
        const t = getTitle(doc);
        if (t) feedTitleEl.textContent = t;

        const { type, items } = getItems(doc);
        const sliced = items.slice(0, limit);
        if (!sliced.length) throw new Error("Aucun item/entry détecté dans le flux.");

        const cardHtmls = [];
        const rowNodes = [];

        sliced.forEach(node => {
          const title = text(node, "title") || "Sans titre";
          const link = getLink(node, type);

          const pubRaw = getPublishedRaw(node, type);
          const dateFr = formatDateFr(pubRaw);

          const descHtml = getSummary(node, type);
          const excerpt = stripHtml(descHtml).slice(0, 260);

          const src = getSourceLabel(node);
          const img = pickImage(node, type);

          const metaLine = buildMetaLine(src, dateFr);

          // LIST row
          const row = document.createElement("a");
          row.className = "row";
          row.href = link;
          row.target = "_blank";
          row.rel = "noopener noreferrer";
          row.innerHTML = `
            <div class="thumb ${img ? "" : "placeholder"}" style="${img ? `background-image:url('${img}')` : ""}"></div>
            <div class="txt">
              <div class="row-title">${title}</div>
              ${metaLine}
              ${excerpt ? `<p class="excerpt">${excerpt}${excerpt.length>=260 ? "…" : ""}</p>` : ``}
            </div>
          `;
          rowNodes.push(row);

          // CAROUSEL card
          const card = `
            <a class="card" href="${link}" target="_blank" rel="noopener noreferrer">
              <div class="card-thumb" style="${img ? `background-image:url('${img}')` : ""}"></div>
              <div class="content">
                <div class="card-title">${title}</div>
                ${metaLine}
                ${excerpt ? `<p class="excerpt">${excerpt}${excerpt.length>=260 ? "…" : ""}</p>` : ``}
              </div>
            </a>
          `;
          cardHtmls.push(card);
        });

        if (layout === "carousel") renderCarousel(cardHtmls);
        else renderList(rowNodes);
      })
      .catch(err => showError("Erreur : " + (err && err.message ? err.message : err)));
  </script>
</body>
</html>
