<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSS Embed</title>

  <!-- Roboto (fallback system) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Swiper (carrousel) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <style>
    :root{
      --line:#dde5ec;
      --muted:#6b7c89;
      --text:#1f2933;
      --bg:#ffffff;
      --soft:#f3f6f9;
      --font: Roboto, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    }

    html, body{
      margin:0;
      padding:0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    .wrap{ padding:14px 16px 18px; }

    /* Header optionnel (masqué si header=0) */
    .title{ font-size:18px; font-weight:700; margin:0 0 6px; }
    .hint{ font-size:12px; color:var(--muted); margin:0 0 12px; }

    /* Empêche tout style de liste/puce injecté */
    #listBox, #slides { list-style:none; padding-left:0; margin:0; }

    /* -------------------------
       Meta : source + date
    ------------------------- */
    .meta-line{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin: 0 0 8px;
    }

    .source{
      font-size:12px;
      font-weight:600;
      color:#334155;
    }

    .meta{
      font-size:12px;
      color:var(--muted);
    }

    /* -------------------------
       LISTE (vertical)
    ------------------------- */
    .list{ display:flex; flex-direction:column; gap:12px; }

    .row{
      display:flex;
      gap:12px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      text-decoration:none;
      color:inherit;
      background:#fff;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .row:hover{ border-color:#b9c7d3; }

    .thumb{
      width:180px;
      min-width:180px;
      height:104px;
      border-radius:12px;
      border:1px solid var(--line);
      background-size:cover;
      background-position:center;
      background-color:var(--soft);
      overflow:hidden;
    }

    /* Si pas d'image en LISTE -> on supprime la colonne image (alignement propre) */
    .row.no-thumb{ gap:0; }
    .row.no-thumb .thumb{ display:none; }

    .txt{ flex:1; min-width:0; }

    .row-title{
      font-size:16px;
      font-weight:700;
      line-height:1.25;
      margin:0 0 6px;
    }
    .excerpt{
      font-size:13px;
      line-height:1.35;
      margin:0;
      color:#2f3b45;
    }

    /* -------------------------
       CAROUSEL (Swiper)
    ------------------------- */
    .swiper{ padding-bottom:30px; }
    .swiper-slide{ height:auto; }

    .card{
      display:block;
      text-decoration:none;
      color:inherit;
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      background:#fff;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .card:hover{ border-color:#b9c7d3; }

    /* Image / placeholder : toujours propre */
    .card-thumb{
      height:140px;
      background-size:cover;
      background-position:center;
      background-color:var(--soft);
      border-bottom:1px solid var(--line);
    }

    .content{ padding:12px 12px 14px; }

    .card-title{
      font-size:15px;
      font-weight:700;
      line-height:1.25;
      margin:0 0 6px;
    }

    /* Flèches Swiper plus discrètes */
    .swiper-button-prev,
    .swiper-button-next{
      width:28px;
      height:28px;
      border-radius:999px;
      background: rgba(255,255,255,.92);
      border: 1px solid var(--line);
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .swiper-button-prev::after,
    .swiper-button-next::after{
      font-size:14px;
      font-weight:700;
    }
    .swiper-button-prev{ left: 8px; }
    .swiper-button-next{ right: 8px; }

    /* Erreurs */
    .error{
      padding:12px;
      border:1px solid var(--line);
      border-radius:10px;
      color:var(--muted);
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1 class="title" id="feedTitle">Flux RSS</h1>
    <p class="hint" id="hint"></p>

    <!-- Carousel -->
    <div class="swiper" id="swiperBox" style="display:none;">
      <div class="swiper-wrapper" id="slides"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
      <div class="swiper-pagination"></div>
    </div>

    <!-- List -->
    <div class="list" id="listBox" style="display:none;"></div>

    <div id="err" class="error" style="display:none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
