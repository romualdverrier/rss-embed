<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSS Embed</title>

  <!-- Roboto (si bloqué, fallback system) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Swiper (carrousel) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

  <style>
    :root{
      --line:#dde5ec;
      --muted:#6b7c89;
      --text:#1f2933;
      --font: Roboto, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    }

    body{
      margin:0;
      font-family: var(--font);
      background:#fff;
      color:var(--text);
    }

    .wrap{ padding:14px 16px 18px; }

    /* Header optionnel (souvent caché via header=0) */
    .title{ font-size:18px; font-weight:700; margin:0 0 8px; }
    .hint{ font-size:12px; color:var(--muted); margin:0 0 12px; }

    /* Meta */
    .meta-line{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      margin: 0 0 8px;
    }
    .meta{ font-size:12px; color:var(--muted); }

    /* Source badge : SANS liseré */
    .badge{
      display:inline-flex;
      align-items:center;
      font-size:12px;
      font-weight:600;
      color:#334155;
      background:#eef2f6;
      border:0;
      border-radius:999px;
      padding: 2px 10px;
      white-space: nowrap;
      line-height: 1.6;
    }

    /* Empêche tout style de liste/puce injecté */
    #listBox, #slides { list-style:none; padding-left:0; margin:0; }

    /* -------------------------
       LISTE (vertical)
    ------------------------- */
    .list{ display:flex; flex-direction:column; gap:12px; }

    .row{
      display:flex;
      gap:12px;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      text-decoration:none;
      color:inherit;
      background:#fff;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .row:hover{ border-color:#b9c7d3; }

    .thumb{
      width: 180px;
      min-width: 180px;
      height: 104px;
      border-radius:12px;
      border:1px solid var(--line);
      background-size: cover;
      background-position: center;
      background-color: #f3f6f9;
      position: relative;
      overflow: hidden;
    }

    /* Placeholder (utilisé surtout en carousel; en list on cache la thumb si pas d'image) */
    .thumb.placeholder::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(135deg, rgba(221,229,236,.95), rgba(243,246,249,.95));
    }

    .txt{ flex:1; min-width:0; }

    .row-title{
      font-size:16px;
      font-weight:700;
      line-height:1.25;
      margin:0 0 6px;
    }
    .excerpt{
      font-size:13px;
      line-height:1.35;
      margin:0;
      color:#2f3b45;
    }

    /* IMPORTANT : si pas d’image en LISTE -> pas de colonne image */
    .row.no-thumb{ gap:0; }
    .row.no-thumb .thumb{ display:none; }

    /* -------------------------
       CAROUSEL
    ------------------------- */
    .swiper{ padding-bottom:30px; }
    .swiper-slide{ height:auto; }

    .card{
      display:block;
      text-decoration:none;
      color:inherit;
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      background:#fff;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    .card:hover{ border-color:#b9c7d3; }

    .card-thumb{
      height:140px;
      background-size:cover;
      background-position:center;
      border-bottom:1px solid var(--line);
      background-color:#f3f6f9;
    }

    .content{ padding:12px 12px 14px; }

    .card-title{
      font-size:15px;
      font-weight:700;
      line-height:1.25;
      margin:0 0 6px;
    }

    .error{
      padding:12px;
      border:1px solid var(--line);
      border-radius:10px;
      color:var(--muted);
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1 class="title" id="feedTitle">Flux RSS</h1>
    <p class="hint" id="hint"></p>

    <!-- Carousel -->
    <div class="swiper" id="swiperBox" style="display:none;">
      <div class="swiper-wrapper" id="slides"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
      <div class="swiper-pagination"></div>
    </div>

    <!-- List -->
    <div class="list" id="listBox" style="display:none;"></div>

    <div id="err" class="error" style="display:none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
